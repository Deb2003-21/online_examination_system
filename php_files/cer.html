<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="bg-white border-2 border-gray-300 p-10 rounded-lg shadow-lg max-w-2xl mx-auto">
    <div class="text-center mb-8">
      <img src="logo.png" alt="Logo" class="mx-auto w-24 mb-4">
      <h1 class="text-3xl font-bold text-gray-700">Certificate of Achievement</h1>
      <p class="text-gray-600">This is to certify that</p>
    </div>
    <div class="text-center mb-8">
      <h2 class="text-2xl font-semibold text-gray-800 border-b-2 border-gray-300 inline-block py-2 px-4">[Recipient Name]</h2>
    </div>
    <div class="text-center mb-8">
      <p class="text-gray-600">has successfully achieved</p>
      <h3 class="text-xl font-semibold text-gray-700 border-b-2 border-gray-300 inline-block py-2 px-4">[Grade]</h3>
    </div>
    <div class="text-center">
      <p class="text-gray-600 mb-4">on</p>
      <p class="text-lg font-semibold text-gray-700 border-b-2 border-gray-300 inline-block py-2 px-4">[Date]</p>
    </div>
  </div>
</body>
</html>
